<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Backend health (staff)</title>
  <link rel="stylesheet" href="donate.css">
  <link rel="stylesheet" href="health.css">
</head>
<body>
  <div class="banner" role="status">Staff only. Fictional demo data.</div>
  <main class="wrap">
    <h1>Backend health</h1>

    <form id="pin-form" method="post" action="#" autocomplete="off">
      <div class="field">
        <label for="pin">Staff PIN</label>
        <input id="pin" name="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64">
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <button type="submit" id="load">Show health</button>
    </form>

    <div id="report" hidden>
      <div class="bar">
        <button type="button" id="refresh" class="secondary">Refresh</button>
        <label class="auto"><input type="checkbox" id="auto" checked> <span>Auto-refresh every 15 s</span></label>
      </div>
      <p id="updated" class="fine" aria-live="polite"></p>
      <div id="sections"></div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="health.js"></script>
</body>
</html>
